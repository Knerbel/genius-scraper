[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genius-scraper"
version = "0.1.0"
description = "Build a network of musicians referencing each other in lyrics, based on Genius annotations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "SQLAlchemy>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
genius-scraper = "genius_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
