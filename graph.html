<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>Genius reference graph</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    #layout { display: flex; width: 100%; height: 100vh; height: 100dvh; }
    #sidebar { width: clamp(210px, 22vw, 300px); flex: none; display: flex;
                         flex-direction: column; border-right: 1px solid #d8dfe5; background: #fff; }
    #legend { padding: 12px 16px; border-bottom: 1px solid #d8dfe5;
                        font-size: 13px; line-height: 1.7; }
    #node-index { overflow-y: auto; flex: 1; padding: 8px 0 16px; }
    #node-index h2 { margin: 12px 16px 4px; color: #53616a; font-size: 12px; }
    .node-link { display: block; width: 100%; padding: 7px 16px; border: 0;
                             background: transparent; text-align: left; font: inherit;
                             font-size: 13px; line-height: 1.4; cursor: pointer;
                             overflow-wrap: anywhere; }
    .node-link:hover, .node-link:focus-visible { background: #eaf4f8; }
    .node-link:focus-visible { outline: 2px solid #207ca6; outline-offset: -2px; }
    .node-count { color: #7a8a93; }
    #graph-wrap { flex: 1; min-width: 0; position: relative; }
    #graph { position: absolute; inset: 0; }
  .dot { display: inline-block; width: 12px; height: 12px; margin-right: 6px; }
    #barchart { position: absolute; top: 12px; right: 12px; width: clamp(220px, 26vw, 320px);
                            background: rgba(255,255,255,0.92); border: 1px solid #d8dfe5;
                            border-radius: 6px; padding: 10px 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
    #barchart h3 { margin: 0 0 8px; font-size: 12px; color: #53616a; }
    .bar-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; }
    .bar-label { width: 35%; flex: none; overflow: hidden; text-overflow: ellipsis;
                             white-space: nowrap; }
    .bar-track { flex: 1; background: #eef1f3; border-radius: 3px; height: 14px; position: relative; }
    .bar-fill { display: block; background: #f39c12; height: 100%; border-radius: 3px; }
    .bar-value { flex: none; width: 28px; text-align: right; color: #53616a; }
    @media (max-width: 640px) {
        #layout { flex-direction: column-reverse; }
        #sidebar { width: 100%; height: 36%; border-right: 0;
                             border-top: 1px solid #d8dfe5; }
        #legend { display: flex; flex-wrap: wrap; gap: 0 12px; padding: 6px 12px; }
        #graph-wrap { min-height: 0; }
    }
</style>
</head>
<body>
<div id="layout">
<aside id="sidebar">
<div id="legend">
  <div><span class="dot" style="background:#e74c3c"></span>Start song</div>
  <div><span class="dot" style="background:#3498db"></span>Scanned song</div>
  <div><span class="dot" style="background:#bdc3c7"></span>Not scanned (limit)</div>
  <div><span class="dot" style="background:#f39c12;border-radius:50%"></span>Artist</div>
    <div><span class="dot" style="background:#27ae60;height:3px;vertical-align:middle"></span>Primary artist arrow</div>
</div>
<nav id="node-index" aria-label="Graph nodes">
<h2>Songs</h2>
<button type="button" class="node-link" data-node-id="song:72937">American Idiot</button>
<button type="button" class="node-link" data-node-id="song:52836">Back to Black</button>
<button type="button" class="node-link" data-node-id="song:63759">Boulevard of Broken Dreams</button>
<button type="button" class="node-link" data-node-id="song:197191">Can’t Help Falling in Love</button>
<button type="button" class="node-link" data-node-id="song:109096">Creep</button>
<h2>Artists</h2>
<button type="button" class="node-link" data-node-id="artist:https://genius.com/artists/amy-winehouse">Amy Winehouse <span class="node-count">(2)</span></button>
<button type="button" class="node-link" data-node-id="artist:https://genius.com/artists/billie-joe-armstrong">Billie Joe Armstrong <span class="node-count">(6)</span></button>
<button type="button" class="node-link" data-node-id="artist:https://genius.com/artists/elvis-presley">Elvis Presley <span class="node-count">(1)</span></button>
<button type="button" class="node-link" data-node-id="artist:https://genius.com/artists/green-day">Green Day <span class="node-count">(0)</span></button>
<button type="button" class="node-link" data-node-id="artist:https://genius.com/artists/radiohead">Radiohead <span class="node-count">(1)</span></button>

</nav>
</aside>
<div id="graph-wrap">
<div id="graph"></div>
<div id="barchart">
    <h3>Top artists by references</h3>
    <div id="barchart-rows"></div>
</div>
</div>
</div>
<script>
  const data = {"nodes": [{"id": "song:72937", "label": "American Idiot", "title": "American Idiot by Green Day - 4 annotations", "shape": "box", "color": "#e74c3c", "font": {"color": "#fff"}}, {"id": "song:63759", "label": "Boulevard of Broken Dreams", "title": "Boulevard of Broken Dreams by Green Day - 2 annotations", "shape": "box", "color": "#3498db", "font": {"color": "#fff"}}, {"id": "song:52836", "label": "Back to Black", "title": "Back to Black by Amy Winehouse - 1 annotation", "shape": "box", "color": "#3498db", "font": {"color": "#fff"}}, {"id": "song:197191", "label": "Can\u2019t Help Falling in Love", "title": "Can\u2019t Help Falling in Love by Elvis Presley - 0 annotations", "shape": "box", "color": "#3498db", "font": {"color": "#fff"}}, {"id": "song:109096", "label": "Creep", "title": "Creep by Radiohead - 0 annotations", "shape": "box", "color": "#3498db", "font": {"color": "#fff"}}, {"id": "artist:https://genius.com/artists/green-day", "label": "Green Day", "shape": "dot", "color": "#f39c12", "title": "Green Day - 0 annotations", "count": 0}, {"id": "artist:https://genius.com/artists/billie-joe-armstrong", "label": "Billie Joe Armstrong", "shape": "dot", "color": "#f39c12", "title": "Billie Joe Armstrong - 6 annotations", "count": 6}, {"id": "artist:https://genius.com/artists/amy-winehouse", "label": "Amy Winehouse", "shape": "dot", "color": "#f39c12", "title": "Amy Winehouse - 2 annotations", "count": 2}, {"id": "artist:https://genius.com/artists/elvis-presley", "label": "Elvis Presley", "shape": "dot", "color": "#f39c12", "title": "Elvis Presley - 1 annotation", "count": 1}, {"id": "artist:https://genius.com/artists/radiohead", "label": "Radiohead", "shape": "dot", "color": "#f39c12", "title": "Radiohead - 1 annotation", "count": 1}], "edges": [{"from": "artist:https://genius.com/artists/green-day", "to": "song:72937", "color": "#27ae60", "title": "primary artist"}, {"from": "song:72937", "to": "artist:https://genius.com/artists/billie-joe-armstrong", "title": "4 annotation(s)"}, {"from": "artist:https://genius.com/artists/billie-joe-armstrong", "to": "song:63759", "dashes": true, "title": "most popular song"}, {"from": "artist:https://genius.com/artists/green-day", "to": "song:63759", "color": "#27ae60", "title": "primary artist"}, {"from": "song:63759", "to": "artist:https://genius.com/artists/amy-winehouse", "title": "1 annotation(s)"}, {"from": "artist:https://genius.com/artists/amy-winehouse", "to": "song:52836", "dashes": true, "title": "most popular song"}, {"from": "song:63759", "to": "artist:https://genius.com/artists/elvis-presley", "title": "1 annotation(s)"}, {"from": "artist:https://genius.com/artists/elvis-presley", "to": "song:197191", "dashes": true, "title": "most popular song"}, {"from": "artist:https://genius.com/artists/amy-winehouse", "to": "song:52836", "color": "#27ae60", "title": "primary artist"}, {"from": "song:52836", "to": "artist:https://genius.com/artists/radiohead", "title": "1 annotation(s)"}, {"from": "artist:https://genius.com/artists/radiohead", "to": "song:109096", "dashes": true, "title": "most popular song"}, {"from": "artist:https://genius.com/artists/elvis-presley", "to": "song:197191", "color": "#27ae60", "title": "primary artist"}, {"from": "artist:https://genius.com/artists/radiohead", "to": "song:109096", "color": "#27ae60", "title": "primary artist"}]};
    const topArtists = data.nodes
        .filter(node => node.id.startsWith("artist:") && typeof node.count === "number")
        .sort((a, b) => b.count - a.count)
        .slice(0, 5);
    const maxCount = topArtists.length ? topArtists[0].count : 0;
    document.getElementById("barchart-rows").innerHTML = topArtists.map(node => `
        <div class="bar-row">
            <span class="bar-label" title="${node.label}">${node.label}</span>
            <span class="bar-track"><span class="bar-fill" style="width:${maxCount ? (node.count / maxCount) * 100 : 0}%"></span></span>
            <span class="bar-value">${node.count}</span>
        </div>
    `).join("");
    const network = new vis.Network(document.getElementById("graph"),
    { nodes: new vis.DataSet(data.nodes), edges: new vis.DataSet(data.edges) },
    { edges: { arrows: "to", smooth: false },
      physics: { solver: "forceAtlas2Based", stabilization: { iterations: 200 } } });
    document.querySelectorAll(".node-link").forEach(button => {
        button.addEventListener("click", () => {
            const id = button.dataset.nodeId;
            network.selectNodes([id]);
            network.focus(id, { scale: 1.1, animation: { duration: 400 } });
        });
    });
</script>
</body>
</html>
